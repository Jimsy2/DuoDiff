<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DuoDiff v1.0 - Differences highlighter for text</title>
<meta name="description" content="DuoDiff is single-file html-page comparing two text files and highlighting the differences.">

<style>
:root {
  /* default: Dark Mode (VS Code Dark Style) */
  --bg-color: #1e1e1e;
  --panel-bg: #252526;
  --text-color: #d4d4d4;
  --border-color: #3f3f46;
  --accent-color: #0e639c;
  --focus-color: #007acc;
  --mark-bg: #855a00;
  --mark-color: #ffffff;
  --panel-focus-outline: #5a5a66;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
  padding: 0 0 15px 0;
  padding-bottom: 52px; /* keep room for the fixed status bar */
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 999;   
  display: flex;  
  gap: 10px;
  align-items: center;
  background-color: var(--panel-bg); 
  padding: 12px 12px;
  margin-bottom: 12px;
  border: 1px solid var(--border-color);
  border-top: none;
}
	
.toolbar-title {
  font-size: 18px;
  color: var(--text-color);
  margin-left: 6px;
  margin-right: 20px;
}

.toolbar-spacer {
  flex: 1;
}
	
button {
  background: var(--accent-color);
  color: #fff;
  border: none;
  padding: 6px 14px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 4px;
}

button:hover { background: #1177bb; }

#check-btn {
  min-width: 110px; /* Gives the button a fixed width so that it doesn't wobble. */
  text-align: center;
}
	
.toolbar-checkbox {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 14px;
  user-select: none;
  color: var(--text-color);
  padding: 4px 8px;
  border-radius: 2px;
}

.toolbar-checkbox:hover {
  background-color: rgba(255, 255, 255, 0.05);
}

.toolbar-checkbox input {
  cursor: pointer;
  width: 16px;
  height: 16px;
}

.status-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;
  height: 40px;
  display: flex;
  align-items: center;
  background-color: var(--panel-bg);
  border-top: 1px solid var(--border-color);
  color: #aaa;
  font-size: 14px;
}

.status-item {
  flex: 1;
  padding: 0 12px;
  white-space: nowrap;
}

.status-item.left {
  text-align: left;
}

.status-item.middle {
  text-align: center;
}

.status-item.right {
  text-align: right;
}

.diff-count {
  margin-left: 10px;
  font-size: 13px;
  color: #aaa;
  font-weight: bold;
}

#mod-count {
  margin-left: auto;
}

.panel-frame {
  display: table; /* was grid */
  /* grid-template-columns: 1fr 1fr;
  gap: 10px; */
  width: 100%;
  table-layout: fixed;
  border-spacing: 10px 0; /* Ersetzt den Grid-Gap */
  margin-left:0;
}

.text-panel {
  box-sizing: border-box;
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  padding: 4px 8px;
  height: 82vh;
  font-family: inherit;	color:inherit;
  white-space: pre-wrap; /* at start word wrap is aktive */
  word-break: break-all;
  overflow-x: auto;
  &:focus-visible {outline: 1px solid var(--panel-focus-outline)};
  display: table-cell;
  width: 50%;
}

/* Line-wrapping disabled mode for source code view */
.text-panel.no-wrap {
  white-space: pre;
  word-break: normal;
}

/* Highlighting for differences (modifications) found */
mark.mod {
  background-color: var(--mark-bg);
  color: var(--mark-color);
  border-radius: 2px;
  padding: 0 2px;
}

/* Automatic switch when Dark Mode is disabled */
@media (prefers-color-scheme: light) {
  :root {
    --bg-color: #f3f3f3;
    --panel-bg: #ffffff;
    --text-color: #333333;
    --border-color: #cccccc;
    --accent-color: #0078d4;
    --focus-color: #005a9e;
    --mark-bg: #fff066; /* A lighter yellow for markings in light mode */
    --mark-color: #000000;
  }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title"><b>DuoDiff</b> v1.0</div>
  <button onclick="clearPanels()">Clear panels</button>
  <div class="toolbar-spacer"></div>
  <button onclick="saveState()">Save current state (Ctrl+S)</button>
  <label class="toolbar-checkbox">
    <input type="checkbox" id="toggle-wrap-cb" onchange="toggleWordWrap()" checked>
    Word wrap
  </label>
  <label class="toolbar-checkbox" title="Toggling line numbers will reset current highlight markers.">
    <input type="checkbox" id="toggle-lines-cb" onchange="toggleLineNumbers()">
    Line numbers
  </label>
  <label class="toolbar-checkbox">
    <input type="checkbox" id="toggle-highlight-cb" onchange="toggleHighlight()">
    Highlight differences
  </label>
  <button onclick="checkDiff()" id="check-btn">Diff-Check</button>
</div>

<div class="status-bar">
  <div class="status-item left">
    <span id="left-line-count">Lines: 0</span>
  </div>
  <div class="status-item middle">
    <span id="mod-count">Highlights: 0</span>
  </div>
  <div class="status-item right">
    <span id="right-line-count">Lines: 0</span>
  </div>
</div>


<div class="panel-frame">
  <div id="left-panel" class="text-panel" contenteditable="true" spellcheck="false">Left panel
Drag & drop a text file here
or paste/edit text directly

Here is text
Another line</div>

  <div id="right-panel" class="text-panel" contenteditable="true" spellcheck="false">Right panel
Drag & drop a text file here
or paste/edit text directly

Here is modified text
Another line
This is an additional line.</div>
</div>

<script id="app-script">
// GLOBAL STATE
let lineNumbersActive = false;
let highlightingActive = false;
let wordWrapActive = true;
const MAX_FILE_SIZE = 512 * 1024; // 512 KB
const ALLOWED_TEXT_EXTENSIONS = [
  'adoc', 'asciidoc', 'bash', 'c', 'cmake', 'conf', 'config', 'cpp', 'css', 'csv',
  'dart', 'diff', 'dockerfile', 'env', 'eml',
  'go', 'gradle', 'h', 'html', 'htm', 'ini', 
  'js', 'json', 'kt', 'latex', 'log', 'lua', 
  'makefile', 'maven', 'markdown', 'md', 'mhtml', 'norg', 
  'org', 'pl', 'py', 'java', 'patch','php', 'pom', 'properties', 
  'r', 'rb', 'rs', 'rst', 'scala', 'sh', 'sql', 'svg', 'swift',
  'tex', 'toml', 'ts', 'txt',
  'vim', 'xhtml', 'xml', 'yml', 'yaml', 'zsh'
];
// Initialize status bar on page load
updateStatusBar();
	
//
// FUNCTIONS CALLED BY onClick and onChange
//	
function clearPanels() {
  const left = document.getElementById('left-panel');
  const right = document.getElementById('right-panel');  
  left.innerText = '';
  right.innerText = '';
  
  if (highlightingActive) {
    highlightingActive = false;
    document.getElementById('toggle-highlight-cb').checked = false;
  }
  if (lineNumbersActive) {
    lineNumbersActive = false;
    document.getElementById('toggle-lines-cb').checked = false;
  }
  updateStatusBar();
  updateCheckButtonText();
}
	

function toggleWordWrap() {
  const leftPanel = document.getElementById('left-panel');
  const rightPanel = document.getElementById('right-panel');

  if (wordWrapActive) {
    // Disable word wrap -> Enable scrolling
    leftPanel.classList.add('no-wrap');
    rightPanel.classList.add('no-wrap');
    wordWrapActive = false;
  } else {
    // Re-enable line breaks
    leftPanel.classList.remove('no-wrap');
    rightPanel.classList.remove('no-wrap');
    wordWrapActive = true;
  }
}


function toggleLineNumbers() {
  const linesCb = document.getElementById('toggle-lines-cb');
  const highlightCb = document.getElementById('toggle-highlight-cb');

  if (lineNumbersActive) {
    stripNumbers();
    lineNumbersActive = false;
    linesCb.checked = false;
  } else {
    // If inactive: Add numbers
    renumberBoth();
    lineNumbersActive = true;
    linesCb.checked = true;
  }
  // Turn OFF highlighting if it's active
  if (highlightingActive) {
    stripHighlights();
    highlightingActive = false;
    highlightCb.checked = false;
  }
}

	
function toggleHighlight() {
  if (highlightingActive) {
    stripHighlights();
    highlightingActive = false;
    document.getElementById('toggle-highlight-cb').checked = false;
  } else {
    highlightDiff();
    highlightingActive = true;
    document.getElementById('toggle-highlight-cb').checked = true;
  }
  updateCheckButtonText(); // <-- Aktualisiert den Button-Text
}

function checkDiff() {
  highlightingActive = true;
  document.getElementById('toggle-highlight-cb').checked = true;
  highlightDiff();
  updateCheckButtonText(); // <-- Aktualisiert den Button-Text
}

		
function updateCheckButtonText() {
  const btn = document.getElementById('check-btn');
  if (btn) {
    btn.innerText = highlightingActive ? ' Re-Check' : 'Diff-Check';
  }
}
//
// EVENT-LISTENERS and associated functions
//
	
// Intercept Ctrl+S ...
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveState();
  }
});


function saveState() {
// ... saves the current DOM state
  const docHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([docHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = location.pathname.split('/').pop() || 'DuoDiff.html';
  a.click();
  URL.revokeObjectURL(a.href);
}


document.addEventListener('dragover', function (e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});


document.addEventListener('drop', function (e) {
  e.preventDefault();

  const files = e.dataTransfer.files;
  if (!files || files.length === 0) return;

  const file = files[0];

  // Validate file before reading
  if (!isAllowedTextFile(file.name, file.size)) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {
    const text = event.target.result;
    // Assignment of the drop zone based on the screen half
    const isLeft = e.clientX < window.innerWidth / 2;
    const side = isLeft ? 'left' : 'right';
    const targetPanel = document.getElementById(`${side}-panel`);

    targetPanel.innerText = text;

    const count = lineNumbersActive ? renumberLines(targetPanel) : undefined;
    updateLineCount(side, count);

    // If highlighting is active, turn it off and sync checkbox
    if (highlightingActive) {
      stripHighlights();
      highlightingActive = false;
      document.getElementById('toggle-highlight-cb').checked = false;
    } else {
      updateHighlightCount();
    }
  };
  reader.onerror = function () {
    alert('Error reading file. Make sure it is a valid text file.');
  };

  reader.readAsText(file);
});

	
function isAllowedTextFile(filename, fileSize) {
  // Check file size
  if (fileSize > MAX_FILE_SIZE) {
    alert(`File too large. Maximum size is ${MAX_FILE_SIZE / (1024 * 1024)} MB.`);
    return false;
  }
  const extension = getFileExtension(filename);
  // Check if extension is in allowed list
  if (!extension || !ALLOWED_TEXT_EXTENSIONS.includes(extension)) {
    const proceed = confirm(
      `File extension ".${extension}" is not in the list of common text file extension.\n\n` +
      `Continue anyway? (The file will be read as plain text.)`
    );
    return proceed;
  }
  return true;
}


function getFileExtension(filename) {
  const parts = filename.split('.');
  if (parts.length > 1) {
    return parts[parts.length - 1].toLowerCase();
  }
  return '';
}

//
// MAIN SUB-ROUTINES
//
	
function renumberBoth() {
  const left = document.getElementById('left-panel');
  const right = document.getElementById('right-panel');
  lineNumbersActive = true;
  // Pass the return line counts directly to the status bar.
  updateLineCount('left',renumberLines(left));
  updateLineCount('right',renumberLines(right));
}


function renumberLines(panel) {
// ... assigns line numbers in the format "1› ", "2› ", "3› "
// and returns the number of lines processed.
  const lines = getLinesFrom(panel);
  const renumbered = lines.map((line, index) => {
    // Entfernt "Zahl + › + 1 Leerzeichen" am Anfang der Zeile
    const cleanLine = line.replace(/^\d+› /, '');
    // Beim Nummerieren wird ein Leerzeichen nach dem › eingefügt
    return `${index + 1}› ${cleanLine}`;
  }).join('\n');
  panel.innerText = renumbered;
  return lines.length; // Gibt die Gesamtzeilenanzahl zurück
}


function stripNumbers() {
  // In stripNumbers(), we ensure that the toggle state remains synchronized.
  // ... selectively deletes ONLY generated line numbers with the format "n› "
  const left = document.getElementById('left-panel');
  const right = document.getElementById('right-panel');
  
  const removeNum = panel => {
    const lines = getLinesFrom(panel);
    // searches at the beginning of the line for numbers followed by › and a space ...
    const clean = lines.map(l => l.replace(/^\d+› /, '')).join('\n');
    panel.innerText = clean;
  };
  removeNum(left);
  removeNum(right);
  
  lineNumbersActive = false;
  document.getElementById('toggle-lines-cb').checked = false;
  updateStatusBar();
}

	
function stripHighlights() {
  const left = document.getElementById('left-panel');
  const right = document.getElementById('right-panel');
  // Remove HTML markup and keep plain text using our helper function
  left.innerText = getRawTextFrom(left);
  right.innerText = getRawTextFrom(right);
  updateStatusBar();
}

	
function highlightDiff() {
  // stripNumbers() is no longer called here, as line numbers are preserved since version 0.6.

  const leftPanel = document.getElementById('left-panel');
  const rightPanel = document.getElementById('right-panel');

  // Remove previous HTML markers (<mark>)
  leftPanel.innerText = getRawTextFrom(leftPanel);
  rightPanel.innerText = getRawTextFrom(rightPanel);

  // Helper function to separate the prefix from the actual content
  const parseLine = line => {
    if (lineNumbersActive) {
      // We only split off the "n› " prefix if numbering is active.
      const match = line.match(/^(\d+› )(.*)/);
      return {
        prefix: match ? match[1] : '',
        content: match ? match[2] : line
      };
    }
    // When not active, the prefix for the line number is empty ...
    return { prefix: '', content: line };
  };

  const linesL = getLinesFrom(leftPanel).map(parseLine);
  const linesR = getLinesFrom(rightPanel).map(parseLine);

  // Helper for comparing a column against the target column
  const processPanel = (sourceLines, targetLines, isLeftPanel) => {
    return sourceLines.map((item, idx) => {
      const targetItem = targetLines[idx] || null;

      // If the lines differ ...
      if (targetItem !== null && item.content !== targetItem.content) {
        const strLeft = isLeftPanel ? item.content : targetItem.content;
        const strRight = isLeftPanel ? targetItem.content : item.content;

        const inlineResult = diffInline(strLeft, strRight);
        const highlighted = isLeftPanel ? inlineResult.left : inlineResult.right;

        // Outputs the line number (if available) before the marker.
        return escapeHtml(item.prefix) + highlighted;
      }
      // In the event of identity or a missing corresponding line: text stays unchanged ...
      return escapeHtml(item.prefix + item.content);
    }).join('\n');
  };

  // Process both panels with the correct flag.
  leftPanel.innerHTML = processPanel(linesL, linesR, true);
  rightPanel.innerHTML = processPanel(linesR, linesL, false);

  // Update counter
  const totalDiffs = document.querySelectorAll('mark.mod').length;

  updateStatusBar();
}


function diffInline(str1, str2) {
  // Recursive diff with runtime protection for very long source code lines
  // 1. Recursion termination conditions: Identical strings or empty pages ...
  if (str1 === str2) return { left: escapeHtml(str1), right: escapeHtml(str2) };
  if (!str1) return { left: '', right: `<mark class="mod">${escapeHtml(str2)}</mark>` };
  if (!str2) return { left: `<mark class="mod">${escapeHtml(str1)}</mark>`, right: '' };

  // 2. For very long lines (> 300 characters) without a quick match,
  // we abort the fine-grained diff to prevent the browser from freezing.
  const MAX_DIFF_LEN = 300;
  if (str1.length > MAX_DIFF_LEN || str2.length > MAX_DIFF_LEN) {
    // Try to find common characters only at the beginning or end ...
    let prefixLen = 0;
    while (prefixLen < str1.length && prefixLen < str2.length && str1[prefixLen] === str2[prefixLen]) {
      prefixLen++;
    }

    let suffixLen = 0;
    while (
      suffixLen < (str1.length - prefixLen) &&
      suffixLen < (str2.length - prefixLen) &&
      str1[str1.length - 1 - suffixLen] === str2[str2.length - 1 - suffixLen]
    ) {
      suffixLen++;
    }

    const mid1 = str1.slice(prefixLen, str1.length - suffixLen);
    const mid2 = str2.slice(prefixLen, str2.length - suffixLen);

    const prefix = escapeHtml(str1.slice(0, prefixLen));
    const suffix = escapeHtml(str1.slice(str1.length - suffixLen));

    return {
      left: prefix + `<mark class="mod">${escapeHtml(mid1)}</mark>` + suffix,
      right: prefix + `<mark class="mod">${escapeHtml(mid2)}</mark>` + suffix
    };
  }

  // 3. Standard LCS (Longest Common Substring) for short/medium-length strings
  let lcs = findLongestCommonSubstr(str1, str2);
  // If no minimum commonality exists (e.g., < 2 characters): Mark the entire remainder as deviating.
  if (lcs.length < 2) {
    return {
      left: `<mark class="mod">${escapeHtml(str1)}</mark>`,
      right: `<mark class="mod">${escapeHtml(str2)}</mark>`
    };
  }

  const p1 = str1.indexOf(lcs);
  const p2 = str2.indexOf(lcs);
  const head = diffInline(str1.substring(0, p1), str2.substring(0, p2));
  const tail = diffInline(str1.substring(p1 + lcs.length), str2.substring(p2 + lcs.length));

  return {
    left: head.left + escapeHtml(lcs) + tail.left,
    right: head.right + escapeHtml(lcs) + tail.right
  };
}


function findLongestCommonSubstr(str1, str2) {
  // Helper function: Optimized LCS search with early exit
  let longest = "";

  for (let i = 0; i < str1.length; i++) {
    for (let j = i + 1; j <= str1.length; j++) {
      let sub = str1.substring(i, j);
      
      if (!str2.includes(sub)) {
        break;  // Abbruch der inneren Schleife
      }
      
      if (sub.length > longest.length) {
        longest = sub;
        // Early Exit: If an anchor of 15+ characters is found, that should be sufficient ...
        if (longest.length >= 15) return longest;
      }
    }
  }
  return longest;
}


function escapeHtml(str) {
// Helper for diffInline() and highLightDiff()
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function getRawTextFrom(panel) {
// Centralized wrapper to extract normalized raw text from a panel.
  return panel.innerText;
}
/* NOTE: This torso function serves as an abstraction layer to isolate 
// contenteditable browser quirks regarding HTML entity handling and DIV elements
// inserted in addition to line breaks. If browser engines change 
// how editable text/markup is extracted, global adjustments can be made here.
// For example, when changing the panel-frame from `display:table` to 
// `display:grid`, the following fixes are required:
	
function getRawTextFrom(panel) {
  // Der Browser konvertiert block-elemente (div, br) automatisch in \n.
  // Evtl. werden durch <br><div>Kombinationen Leerzeilen verdoppelt.
  // 1. Hole den inneren HTML-Inhalt des Panels
  let uglyText = panel.innerHTML;
  // 2. Falls noch Highlights aktiv sind, diese temporär bereinigen
  uglyText = uglyText.replace(/<\/?mark[^>]*>/gi, '');
  // 3. Typische Browser-Div-Container (Enter-Erzeugung) normalisieren
  uglyText = uglyText.replace(/<\/div>\s*<div>/gi, '\n');
  uglyText = uglyText.replace(/<\/?div>/gi, '');
  // 4. Verbleibende <br>-Tags durch echte Zeilenumbrüche ersetzen
  uglyText = uglyText.replace(/<br\s*[\/]?>/gi, '\n');
  // 5. HTML-Entities (&amp;, &lt; etc.) sauber zu echten Zeichen decodieren,
  // damit escapeHtml() sie später nicht doppelt kodiert.
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = uglyText;
  return tempDiv.innerText || tempDiv.textContent || '';
}
*/


function getLinesFrom(panel) {
// Helper function: Splits plain text line by line
  const rawText = getRawTextFrom(panel);
  // Text an allen gängigen Zeilenumbrüchen (\n oder \r\n) aufsplitten 
  return rawText.replace(/\r\n/g, '\n').split('\n');
}

	
function updateStatusBar() {
// comfort function for complete status reset
  updateLineCount('left');
  updateLineCount('right');
  updateHighlightCount();
}

	
function updateLineCount(side,count) {
  if (count === undefined ) {
    const panel = document.getElementById(`${side}-panel`);
    count = getLinesFrom(panel).length;
  }
  document.getElementById(`${side}-line-count`).innerText = `Lines: ${count}`;
}  

	
function updateHighlightCount() {
  const highlights = document.querySelectorAll('mark.mod').length;
  document.getElementById('mod-count').innerText = `Highlights: ${highlights}`;
}

</script>

</body>
</html>
