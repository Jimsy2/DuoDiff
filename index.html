<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DuoDiff v0.8 - Differences highlighter for text</title>
<meta name="description" content="DuoDiff is single-file html-page comparing two text files and highlighting the differences.">

<style>
:root {
  --bg-color: #1e1e1e;
  --panel-bg: #252526;
  --text-color: #d4d4d4;
  --border-color: #3f3f46;
  --accent-color: #0e639c;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
  padding: 0 15px 15px 15px;
  padding-bottom: 52px; /* keep room for the fixed status bar */
}

.toolbar {
  position: sticky;
  top: 0;
  z-index: 999;   
  display: flex;  
  gap: 10px;
  align-items: center;
  background-color: var(--panel-bg); 
  padding: 12px 12px;
  margin-bottom: 12px;
  border: 1px solid var(--border-color);
  border-top: none;
}
	
.toolbar-title {
  font-size: 18px;
  color: var(--text-color);
  margin-left: 6px;
  margin-right: 20px;
}

.toolbar-spacer {
  flex: 1;
}
	
.status-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 1000;
  height: 40px;
  display: flex;
  align-items: center;
  background-color: var(--panel-bg);
  border-top: 1px solid var(--border-color);
  color: #aaa;
  font-size: 14px;
}

.status-item {
  flex: 1;
  padding: 0 12px;
  white-space: nowrap;
}

.status-item.left {
  text-align: left;
}

.status-item.middle {
  text-align: center;
}

.status-item.right {
  text-align: right;
}

button {
  background: var(--accent-color);
  color: #fff;
  border: none;
  padding: 6px 14px;
  font-size: 16px;
  cursor: pointer;
  border-radius: 2px;
}

button:hover { background: #1177bb; }

button.active {
  background-color: #16825d; /* green color for active buttons */
}
	
.diff-count {
  margin-left: 10px;
  font-size: 13px;
  color: #aaa;
  font-weight: bold;
}

#mod-count {
  margin-left: auto;
}

.panel-frame {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.text-panel {
  width: 50%;
  vertical-align: top;
  padding: 8px;
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  height: 95vh;
  outline: none;
  white-space: pre-wrap;
  word-break: break-all;
}

/* Highlighting for differences/modifications found */
mark.mod {
  background-color: #855a00;
  color: #fff;
  border-radius: 2px;
  padding: 0 2px;
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-title"><b>DuoDiff</b> v0.8</div>
  <button onclick="clearPanels()">Clear panels</button>
  <div class="toolbar-spacer"></div>
  <button id="toggle-lines-btn"
          onclick="toggleLineNumbers()"
          title="Toggling line numbers will reset current highlight markers.">
    Line numbers: OFF
  </button>
  <button id="toggle-highlight-btn"
           onclick="toggleHighlight()">
    Highlight differences: OFF
  </button>
  <button onclick="saveState()">Save current state (Ctrl+S)</button>
</div>

<div class="status-bar">
  <div class="status-item left">
    <span id="left-line-count">Lines: 0</span>
  </div>
  <div class="status-item middle">
    <span id="mod-count">Highlights: 0</span>
  </div>
  <div class="status-item right">
    <span id="right-line-count">Lines: 0</span>
  </div>
</div>


<table class="panel-frame">
<tr>
<td id="left-panel" class="text-panel" contenteditable="true" spellcheck="false">Left panel
Drag & drop a text file here
or paste/edit text directly

Here is text
Another line</td>
<td id="right-panel" class="text-panel" contenteditable="true" spellcheck="false">Right panel
Drag & drop a text file here
or paste/edit text directly

Here is modified text
Another line
This is an additional line.
</td>
</tr>
</table>


<script id="app-script">
// Global state
let lineNumbersActive = false;
let highlightingActive = false;
const MAX_FILE_SIZE = 512 * 1024; // 512 KB
const ALLOWED_TEXT_EXTENSIONS = [
  'txt', 'md', 'markdown', 'json', 'csv', 'xml', 'html', 'htm', 'css', 'js', 'ts',
  'py', 'java', 'cpp', 'c', 'h', 'rb', 'php', 'go', 'rs', 'sh', 'bash', 'yml', 'yaml',
  'toml', 'ini', 'conf', 'config', 'log', 'sql', 'pl', 'swift', 'kt', 'scala', 'r',
  'tex', 'latex', 'rst', 'asciidoc', 'adoc', 'org', 'norg', 'dart', 'lua', 'vim',
  'gradle', 'maven', 'pom', 'dockerfile', 'makefile', 'cmake', 'diff', 'patch',
  'env', 'properties', 'json'
];


function getLinesFromCell(cell) {
// Helper function: Extracts plain text line by line from the contenteditable elements
// `innerText` and automatically converts <div>, <p> and <br> into \n (new line)
  const rawText = cell.innerText || '';
  // Text an allen gängigen Zeilenumbrüchen (\n oder \r\n) aufsplitten 
  return rawText.replace(/\r\n/g, '\n').split('\n');
}


function renumberLines(cell) {
// ... assigns line numbers in the format "1› ", "2› ", "3› "
// and returns the number of lines processed.
  const lines = getLinesFromCell(cell);
  const renumbered = lines.map((line, index) => {
    // Entfernt "Zahl + › + 1 Leerzeichen" am Anfang der Zeile
    const cleanLine = line.replace(/^\d+› /, '');
    // Beim Nummerieren wird ein Leerzeichen nach dem › eingefügt
    return `${index + 1}› ${cleanLine}`;
  }).join('\n');

  cell.innerText = renumbered;
  return lines.length; // Gibt die Gesamtzeilenanzahl zurück
}


function clearPanels() {
  const leftPanel = document.getElementById('left-panel');
  const rightPanel = document.getElementById('right-panel');
  
  leftPanel.innerText = '';
  rightPanel.innerText = '';
  
  // Reset highlighting if active
  if (highlightingActive) {
    const btn = document.getElementById('toggle-highlight-btn');
    highlightingActive = false;
    btn.innerText = "Highlight differences: OFF";
    btn.classList.remove('active');
  }
  
  // Reset line numbers if active
  if (lineNumbersActive) {
    const btn = document.getElementById('toggle-lines-btn');
    lineNumbersActive = false;
    btn.innerText = "Line numbers: OFF";
    btn.classList.remove('active');
  }
  
  updateStatusBar();
}

	
function updateLineCount(side,count) {
  if (count === undefined ) {
    const oneCol = document.getElementById(side+'-panel');
    count = getLinesFromCell(oneCol).length;
	}
  document.getElementById(side+'-line-count').innerText = `Lines: ${count}`;
}

	
function updateHighlightStatus() {
  const highlights = document.querySelectorAll('mark.mod').length;
  document.getElementById('mod-count').innerText = `Highlights: ${highlights}`;
}

	
// comfort function for complete status reset
function updateStatusBar() {
  updateLineCount('left');
  updateLineCount('right');
  updateHighlightStatus();
}

	
function renumberBoth() {
  const leftCol = document.getElementById('left-panel');
  const rightCol = document.getElementById('right-panel');
  lineNumbersActive = true;
  // Pass the return line counts ​​directly to the status bar.
  updateLineCount('left',renumberLines(leftCol));
  updateLineCount('right',renumberLines(rightCol));
}


function toggleLineNumbers() {
  const btn = document.getElementById('toggle-lines-btn');
  if (lineNumbersActive) {
    // If active: Remove numbers and highlights
    stripNumbers();
    btn.innerText = "Line numbers: OFF";
    btn.classList.remove('active');
  } else {
    // If inactive: Add numbers
    renumberBoth();
    btn.innerText = "Line numbers: ON";
    btn.classList.add('active');
  }
  // Turn OFF highlighting if it's active
  if (highlightingActive) {
    const highlightBtn = document.getElementById('toggle-highlight-btn');
    stripHighlights();
    highlightingActive = false;
    highlightBtn.innerText = "Highlight differences: OFF";
    highlightBtn.classList.remove('active');
  }
}


function stripNumbers() {
  // In stripNumbers(), we ensure that the toggle state remains synchronized.
  // ... selectively deletes ONLY generated line numbers with the format "n› "
  const leftCol = document.getElementById('left-panel');
  const rightCol = document.getElementById('right-panel');
  
  const removeNum = cell => {
    const lines = getLinesFromCell(cell);
    // RegEx:^\d+›\s* searches at the beginning of the line for numbers followed by › and a space
    const clean = lines.map(l => l.replace(/^\d+› /, '')).join('\n');
    cell.innerText = clean;
  };
  removeNum(leftCol);
  removeNum(rightCol);
  // Reset status and button text
  lineNumbersActive = false;
  const btn = document.getElementById('toggle-lines-btn');
  if (btn) {
    btn.innerText = "Line numbers: OFF";
    btn.classList.remove('active');
  }
  // Update counter
  updateStatusBar();
}


function diffInline(str1, str2) {
  // Recursive diff with runtime protection for very long source code lines
  // 1. Recursion termination conditions: Identical strings or empty pages ...
  if (str1 === str2) return { left: escapeHtml(str1), right: escapeHtml(str2) };
  if (!str1) return { left: '', right: `<mark class="mod">${escapeHtml(str2)}</mark>` };
  if (!str2) return { left: `<mark class="mod">${escapeHtml(str1)}</mark>`, right: '' };

  // 2. For very long lines (> 300 characters) without a quick match,
  // we abort the fine-grained diff to prevent the browser from freezing.
  const MAX_DIFF_LEN = 300;
  if (str1.length > MAX_DIFF_LEN || str2.length > MAX_DIFF_LEN) {
    // Try to find common characters only at the beginning or end ...
    let prefixLen = 0;
    while (prefixLen < str1.length && prefixLen < str2.length && str1[prefixLen] === str2[prefixLen]) {
      prefixLen++;
    }

    let suffixLen = 0;
    while (
      suffixLen < (str1.length - prefixLen) &&
      suffixLen < (str2.length - prefixLen) &&
      str1[str1.length - 1 - suffixLen] === str2[str2.length - 1 - suffixLen]
    ) {
      suffixLen++;
    }

    const mid1 = str1.slice(prefixLen, str1.length - suffixLen);
    const mid2 = str2.slice(prefixLen, str2.length - suffixLen);

    const prefix = escapeHtml(str1.slice(0, prefixLen));
    const suffix = escapeHtml(str1.slice(str1.length - suffixLen));

    return {
      left: prefix + `<mark class="mod">${escapeHtml(mid1)}</mark>` + suffix,
      right: prefix + `<mark class="mod">${escapeHtml(mid2)}</mark>` + suffix
    };
  }

  // 3. Standard LCS (Longest Common Substring) for short/medium-length strings
  let lcs = findLongestCommonSubstr(str1, str2);
  // If no minimum commonality exists (e.g., < 2 characters): Mark the entire remainder as deviating.
  if (lcs.length < 2) {
    return {
      left: `<mark class="mod">${escapeHtml(str1)}</mark>`,
      right: `<mark class="mod">${escapeHtml(str2)}</mark>`
    };
  }

  const p1 = str1.indexOf(lcs);
  const p2 = str2.indexOf(lcs);
  const head = diffInline(str1.substring(0, p1), str2.substring(0, p2));
  const tail = diffInline(str1.substring(p1 + lcs.length), str2.substring(p2 + lcs.length));

  return {
    left: head.left + escapeHtml(lcs) + tail.left,
    right: head.right + escapeHtml(lcs) + tail.right
  };
}


function findLongestCommonSubstr(str1, str2) {
  // Helper function: Optimized LCS search with early exit
  let longest = "";

  for (let i = 0; i < str1.length; i++) {
    for (let j = i + 1; j <= str1.length; j++) {
      let sub = str1.substring(i, j);
      
      if (!str2.includes(sub)) {
        break;  // Abbruch der inneren Schleife
      }
      
      if (sub.length > longest.length) {
        longest = sub;
        // Early Exit: If an anchor of 15+ characters is found, that should be sufficient ...
        if (longest.length >= 15) return longest;
      }
    }
  }
  return longest;
}


function highlightDiff() {
  // stripNumbers() is no longer called here, as line numbers have been ignored since version 0.6.

  const leftCol = document.getElementById('left-panel');
  const rightCol = document.getElementById('right-panel');

  // Remove previous HTML markers (<mark>)
  leftCol.innerText = leftCol.innerText;
  rightCol.innerText = rightCol.innerText;

  // Helper function to separate the prefix from the actual content
  const parseLine = line => {
    if (lineNumbersActive) {
      // We only split off the "n› " prefix if numbering is active.
      const match = line.match(/^(\d+› )(.*)/);
      return {
        prefix: match ? match[1] : '',
        content: match ? match[2] : line
      };
    }
    // When not active, the prefix for the line number is empty ...
    return { prefix: '', content: line };
  };

  const linesL = getLinesFromCell(leftCol).map(parseLine);
  const linesR = getLinesFromCell(rightCol).map(parseLine);

  // Helper for comparing a column against the target column
  const processColumn = (sourceLines, targetLines, isLeftColumn) => {
    return sourceLines.map((item, idx) => {
      const targetItem = targetLines[idx] || null;

      // If the lines differ ...
      if (targetItem !== null && item.content !== targetItem.content) {
        const strLeft = isLeftColumn ? item.content : targetItem.content;
        const strRight = isLeftColumn ? targetItem.content : item.content;

        const inlineResult = diffInline(strLeft, strRight);
        const highlighted = isLeftColumn ? inlineResult.left : inlineResult.right;

        // Outputs the line number (if available) before the marker.
        return escapeHtml(item.prefix) + highlighted;
      }
      // In the event of identity or a missing corresponding line: text stays unchanged ...
      return escapeHtml(item.prefix + item.content);
    }).join('\n');
  };

  // Process both columns with the correct flag.
  leftCol.innerHTML = processColumn(linesL, linesR, true);
  rightCol.innerHTML = processColumn(linesR, linesL, false);

  // Update counter
  const totalDiffs = document.querySelectorAll('mark.mod').length;

  updateStatusBar();
}


function escapeHtml(str) {
// Helper for diffInline() and highLightDiff()
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}


function toggleHighlight() {
  const btn = document.getElementById('toggle-highlight-btn');

  if (highlightingActive) {
    stripHighlights();
    highlightingActive = false;
    btn.innerText = "Highlight differences: OFF";
    btn.classList.remove('active');
  } else {
    highlightDiff();
    highlightingActive = true;
    btn.innerText = "Highlight differences: ON";
    btn.classList.add('active');
  }
}


function stripHighlights() {
  const leftCol = document.getElementById('left-panel');
  const rightCol = document.getElementById('right-panel');

  // Remove HTML markup and keep plain text
  leftCol.innerText = leftCol.innerText;
  rightCol.innerText = rightCol.innerText;

  updateStatusBar();
}


function saveState() {
// ... saves the current DOM state
  const docHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const blob = new Blob([docHTML], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = location.pathname.split('/').pop() || 'DuoDiff.html';
  a.click();
  URL.revokeObjectURL(a.href);
}

// Intercept Ctrl+S ...
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveState();
  }
});


function getFileExtension(filename) {
  const parts = filename.split('.');
  if (parts.length > 1) {
    return parts[parts.length - 1].toLowerCase();
  }
  return '';
}


function isAllowedTextFile(filename, fileSize) {
  // Check file size
  if (fileSize > MAX_FILE_SIZE) {
    alert(`File too large. Maximum size is ${MAX_FILE_SIZE / (1024 * 1024)} MB.`);
    return false;
  }
  const extension = getFileExtension(filename);
  // Check if extension is in allowed list
  if (!extension || !ALLOWED_TEXT_EXTENSIONS.includes(extension)) {
    const proceed = confirm(
      `File extension ".${extension}" is not in the list of common text file extension.\n\n` +
      `Continue anyway? (The file will be read as plain text.)`
    );
    return proceed;
  }
  return true;
}


document.addEventListener('dragover', function (e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});


document.addEventListener('drop', function (e) {
  e.preventDefault();

  const files = e.dataTransfer.files;
  if (!files || files.length === 0) return;

  const file = files[0];

  // Validate file before reading
  if (!isAllowedTextFile(file.name, file.size)) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {
    const text = event.target.result;
    const isLeft = e.clientX < window.innerWidth / 2;
    const side = isLeft ? 'left' : 'right';
    const targetCol = document.getElementById(`${side}-panel`);

    targetCol.innerText = text;

    // Assignment of the drop zone based on the screen half
    const count = lineNumbersActive ? renumberLines(targetCol) : undefined;
    updateLineCount(side, count);

    // If highlighting is active, turn it off
    if (highlightingActive) {
      const btn = document.getElementById('toggle-highlight-btn');
      stripHighlights();
      highlightingActive = false;
      btn.innerText = "Highlight differences: OFF";
      btn.classList.remove('active');
    } else {
      updateHighlightStatus();
    }
  };
  reader.onerror = function () {
    alert('Error reading file. Make sure it is a valid text file.');
  };

  reader.readAsText(file);
});

// Initialize status bar on page load
updateStatusBar();
</script>

</body>
</html>
